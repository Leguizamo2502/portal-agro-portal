<!-- src/app/shared/components/notifications-menu/notifications-menu.component.html -->
<button
  mat-icon-button
  [matMenuTriggerFor]="menu"
  (menuOpened)="onOpenMenu()"
  [matBadge]="unreadCount"
  [matBadgeHidden]="unreadCount === 0"
  matBadgeOverlap="false"
  aria-label="Abrir notificaciones"
  class="notif-trigger">
  <mat-icon>notifications</mat-icon>
</button>

<mat-menu #menu="matMenu" class="notif-menu" xPosition="before" yPosition="below">
  <div class="menu-header">
    <span>Notificaciones</span>
    <button mat-button *ngIf="showMarkAll" (click)="onMarkAll()">Marcar todo</button>
  </div>
  <mat-divider></mat-divider>

  <div class="loader" *ngIf="loading">
    <mat-spinner diameter="28"></mat-spinner>
  </div>

  <ng-container *ngIf="!loading">
    <ng-container *ngIf="items.length; else empty">
      <div class="notif-list">
        <div class="notif-item" *ngFor="let n of items">
          <button class="item-main" (click)="onOpenItem(n)">
            <mat-icon class="item-icon">{{ n.isRead ? 'notifications_none' : 'notifications_active' }}</mat-icon>
            <div class="item-texts">
              <div class="item-title" [class.unread]="!n.isRead">{{ n.title }}</div>
              <div class="item-msg" *ngIf="n.message">{{ n.message }}</div>
              <div class="item-meta">{{ timeAgo(n.createAt) }}</div>
            </div>
          </button>
          <button mat-icon-button class="mark-btn" (click)="onMarkRead(n)" [disabled]="n.isRead" aria-label="Marcar leído">
            <mat-icon>done</mat-icon>
          </button>
        </div>
      </div>

      <!-- <mat-divider></mat-divider>
      <a mat-stroked-button class="see-all" [routerLink]="pageUrl">Ver todas</a> -->
    </ng-container>

    <ng-template #empty>
      <div class="empty">Sin notificaciones por ahora</div>
    </ng-template>
  </ng-container>
</mat-menu>
