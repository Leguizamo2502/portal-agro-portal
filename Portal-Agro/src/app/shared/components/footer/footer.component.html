<footer class="footer">
  <div class="footer-inner">
    <div class="footer-left">
      <h3 class="footer-title">Portal Agro Comercial</h3>
      <p class="footer-text">
        Conectamos a los productores del Huila con consumidores que valoran la
        calidad y el origen.
      </p>

      <p class="footer-meta">{{ location }}</p>
      <p class="footer-meta">{{ email }}</p>
    </div>

    <div class="footer-right">
      <p class="footer-call">Obtén nuestra app</p>

      <!-- Botón SIEMPRE habilitado -->
      <a
        class="download-app-btn"
        [href]="appDownloadUrl"
        target="_blank"
        rel="noopener"
      >
        Descargar APK
      </a>
    </div>
  </div>

  <div class="footer-bottom">
    © 2025 Portal Agro Comercial del Huila
  </div>
</footer>
